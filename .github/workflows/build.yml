name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test
      - name: Upload core build output
        if: matrix.java-version == '24'
        uses: actions/upload-artifact@v4
        with:
          name: core-target-build
          path: core/target
          retention-days: 3

  mutation-testing:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 24
          distribution: temurin
      - name: Download build output from build job
        uses: actions/download-artifact@v4
        with:
          name: core-target-build
          path: core
          if-no-artifact-found: warn
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Télécharger le baseline depuis master (seulement pour les branches non-master)
      - name: Download baseline from master
        if: github.ref != 'refs/heads/master'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build.yml
          branch: master
          name: mutation-baseline
          path: baseline
          if_no_artifact_found: warn
        continue-on-error: true

      # Exécuter les tests de mutation
      - name: Run mutation tests
        run: .github/scripts/check-mutation-score.sh run

      # Sur master: sauvegarder le rapport comme baseline
      - name: Upload mutation baseline
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-baseline
          path: core/target/pit-reports/mutations.xml
          retention-days: 90

      # Sur les autres branches: comparer avec le baseline
      - name: Compare with baseline
        if: github.ref != 'refs/heads/master'
        run: |
          if [ -f baseline/mutations.xml ]; then
            .github/scripts/check-mutation-score.sh compare baseline/mutations.xml
          else
            echo "⚠️  Aucun baseline trouvé sur master. Premier build?"
            echo "✅ Acceptation du score actuel."
          fi

      # Uploader le rapport pour consultation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ github.sha }}
          path: core/target/pit-reports/
          retention-days: 30
